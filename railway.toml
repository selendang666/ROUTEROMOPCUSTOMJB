[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1

# SQLite telemetry lives under /app/data — must survive redeploys.
[[volumes]]
mountPath = "/app/data"
name = "ohmyomop-data"
